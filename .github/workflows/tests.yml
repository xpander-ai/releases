name: Tests

# The release scripts' tests (tests/), on every pull request that touches them and on main.
# This repo is public: only branches of this repository run here, never a fork, because a fork's code
# would run on our Blacksmith runner, an address the org IP allow list trusts. No secrets, read-only token.
on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Release script tests
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Blacksmith: the org IP allow list refuses GitHub-hosted runners
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # the scripts are stdlib-only; pytest is the one test dependency
      - name: Install pytest
        run: python -m pip install pytest==8.3.3
      - name: Run tests
        run: python -m pytest -v tests/
